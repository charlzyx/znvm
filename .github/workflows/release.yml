name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Rename Artifact
        run: |
          mv zig-out/bin/znvm znvm-${{ github.ref_name }}-${{ matrix.target }}

      - name: Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: znvm-${{ github.ref_name }}-${{ matrix.target }}
          fail_on_unmatched_files: true

  verify:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform binary is downloadable
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            url="https://github.com/charlzyx/znvm/releases/download/${VERSION}/znvm-${VERSION}-${target}"
            echo "GET $url"
            curl -fL --retry 5 --retry-delay 3 -o /dev/null "$url"
          done

  update_repo:
    name: Update repository
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update install.sh version
        run: |
          # Bump install scripts only after all release assets are public.
          sed -i "s/^ZNVM_VERSION=\"[^\"]*\"/ZNVM_VERSION=\"${{ github.ref_name }}\"/" install.sh install-as-nvm.sh
          grep "ZNVM_VERSION=\"${{ github.ref_name }}\"" install.sh install-as-nvm.sh
          cp install-as-nvm.sh ./website/public/install.sh
          cp install-as-nvm.sh ./website/public/install-as-nvm.sh
          cmp -s install-as-nvm.sh ./website/public/install.sh
          cmp -s install-as-nvm.sh ./website/public/install-as-nvm.sh
          sed -i "s/const version = \"v[^\"]*\"/const version = \"${{ github.ref_name }}\"/" website/src/components/hero.tsx
          echo "✅ install scripts and site version updated to ${{ github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh install-as-nvm.sh ./website/public/install.sh ./website/public/install-as-nvm.sh website/src/components/hero.tsx
          if git diff --cached --quiet; then
            echo "install scripts already match ${{ github.ref_name }}"
          else
            git commit -m "Update install.sh for ${{ github.ref_name }}"
            git push origin main
          fi
