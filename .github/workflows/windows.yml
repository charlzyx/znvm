name: Windows compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmd-parser-probe:
    name: cmd persistent cleanup regression
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify persistent batch cleanup and status return
        shell: pwsh
        run: ./scripts/windows-cmd-parser-probe.ps1

  windows-smoke:
    name: Native Windows ${{ matrix.arch }} (PowerShell, cmd, Git Bash)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            target: x86_64-windows-gnu
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-windows-gnu
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Unit tests
        run: zig build test -Dtarget=${{ matrix.target }}
      - name: Build
        id: build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Build deterministic Windows package
        run: |
          ./scripts/package-windows.ps1 -Destination candidate.zip
      - name: Upload Windows candidate ZIP (see smoke results)
        uses: actions/upload-artifact@v4
        with:
          name: znvm-windows-${{ matrix.arch }}
          path: |
            candidate.zip
            candidate.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Download the candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: znvm-windows-${{ matrix.arch }}
          path: downloaded-candidate
      - name: Verify transfer and extracted package bytes
        id: package
        run: |
          $manifest = Get-Content candidate.zip.sha256 -Raw
          $expected = $manifest.Split(' ')[0]
          $downloaded = (Get-FileHash downloaded-candidate/candidate.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloaded -cne $expected -or (Get-Content downloaded-candidate/candidate.zip.sha256 -Raw) -cne $manifest) { throw 'Artifact hash changed during transfer' }
          Expand-Archive -LiteralPath downloaded-candidate/candidate.zip -DestinationPath tested-package
          $files = [ordered]@{
            'bin/nvm.exe' = 'zig-out/bin/nvm.exe'
            'bin/nrm.exe' = 'zig-out/bin/nvm.exe'
            'cmd/nvm.cmd' = 'scripts/cmd/nvm.cmd'
            'cmd/init.cmd' = 'scripts/cmd/init.cmd'
            'cmd/finish.cmd' = 'scripts/cmd/finish.cmd'
            'WINDOWS.md' = 'WINDOWS.md'
          }
          foreach ($name in $files.Keys) {
            $actual = (Get-FileHash (Join-Path 'tested-package' $name) -Algorithm SHA256).Hash
            $source = (Get-FileHash $files[$name] -Algorithm SHA256).Hash
            if ($actual -cne $source) { throw "Extracted package bytes differ: $name" }
          }
          Write-Host "Verified uploaded/downloaded ZIP SHA256=$expected and all extracted file hashes"
          & ./tested-package/bin/nrm.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged nrm.exe failed' }
      - name: Isolated PowerShell smoke from downloaded ZIP
        run: ./scripts/windows-smoke.ps1 -Binary ./tested-package/bin/nvm.exe -ExpectedArch ${{ matrix.arch }}
      - name: Isolated cmd smoke from downloaded ZIP
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: ./scripts/windows-cmd-smoke.ps1 -Binary ./tested-package/bin/nvm.exe -PackageRoot ./tested-package -ExpectedArch ${{ matrix.arch }}
      - name: Isolated Git Bash smoke from downloaded ZIP
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: ./scripts/windows-bash-smoke.ps1 -Binary ./tested-package/bin/nvm.exe -ExpectedArch ${{ matrix.arch }}
