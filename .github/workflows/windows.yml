name: Windows compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    name: Native Windows ${{ matrix.arch }} (PowerShell, cmd, Git Bash)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            target: x86_64-windows-gnu
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-windows-gnu
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Unit tests
        run: zig build test -Dtarget=${{ matrix.target }}
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Isolated native smoke
        run: ./scripts/windows-smoke.ps1 -ExpectedArch ${{ matrix.arch }}
      - name: Isolated cmd smoke
        run: ./scripts/windows-cmd-smoke.ps1 -ExpectedArch ${{ matrix.arch }}
      - name: Isolated Git Bash smoke
        run: ./scripts/windows-bash-smoke.ps1 -ExpectedArch ${{ matrix.arch }}
      - name: Upload tested Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: znvm-windows-${{ matrix.arch }}
          path: zig-out/bin/nvm.exe
          if-no-files-found: error
          retention-days: 7
