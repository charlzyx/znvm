name: Windows compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    name: Native Windows x64 (PowerShell 7)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Unit tests
        run: zig build test
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Isolated native smoke
        run: ./scripts/windows-smoke.ps1
      - name: Upload tested Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: znvm-windows-x64
          path: zig-out/bin/znvm.exe
          if-no-files-found: error
          retention-days: 7
