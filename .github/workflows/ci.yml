name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release guard fixtures (no remote writes)
        run: python3 scripts/test-release-request.py

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Test Zig Binary
        run: bash scripts/test.sh

      - name: Setup Node
        if: runner.os == 'Linux'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Skill install
        if: runner.os == 'Linux'
        run: bash scripts/check-skill-install.sh
