<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <rect width="1400" height="900" fill="#e7f2e4"/>
  <ellipse cx="280" cy="180" rx="460" ry="300" fill="#f6e2b0" fill-opacity="0.55"/>
  <ellipse cx="1080" cy="640" rx="520" ry="340" fill="#b7ddb2" fill-opacity="0.72"/>
  <ellipse cx="760" cy="260" rx="280" ry="180" fill="#f7f6f1" fill-opacity="0.55"/>
  <filter id="grain">
